# Issue: https://github.community/t/pages-deploy-wedged-incorrect-request-failed-due-to-in-progress-deployment/234793/19

name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
      - '!v*-pre-release'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-20.04
    defaults:
      run:
        working-directory: ./website
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 16.x
          cache: yarn
          cache-dependency-path: website/yarn.lock


      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build website
        run: yarn build


      - name: Check docs llms.txt
        run: |
          file=build/llms.txt
          if [ ! -s "$file" ]; then
            echo "::error::$file is missing or empty"
            exit 1
          fi
          count=$(grep -cE '^- \[[^]]+\]\(https://docs\.swmansion\.com/protostar/[^)]+\)' "$file" || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::$file lists no pages"
            exit 1
          fi
          echo "llms.txt lists $count pages"
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com